name: Build iOS IPA (unsigned, for SideStore)
on:
  workflow_dispatch: {}
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Apply the iOS patches
        run: bash tools/ios/apply.sh
      - name: Build
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
        run: bash tools/ios/build.sh 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build
          path: |
            build/ios/StremioOrigin.ipa
            build.log
